<script>
// ===== OMR engine: sheet layout + detection + reading (pure JS, no deps) =====
const OMR = (() => {
  const SHEET_W = 210, SHEET_H = 297;
  const MK = 9; // marker size (mm)
  const MARKERS = [[14, 14], [196, 14], [196, 283], [14, 283]]; // TL, TR, BR, BL centers
  const ORIENT_BAR = { x: 80, y: 10, w: 50, h: 8 };
  const ID_DIGITS = 4;

  const TEMPLATES = {
    20:  { cols: 2, rows: 10, top: 108, pitch: 15.5, r: 3.1, cp: 9.0, lab: 11, gap: 14 },
    50:  { cols: 2, rows: 25, top: 102, pitch: 6.9, r: 2.5, cp: 7.4, lab: 9, gap: 14 },
    100: { cols: 4, rows: 25, top: 102, pitch: 6.9, r: 2.25, cp: 6.0, lab: 7.5, gap: 4.5 },
  };
  function templateFor(nQ) { return nQ <= 20 ? 20 : nQ <= 50 ? 50 : 100; }

  // Layout is RTL: first column on the right, choice 0 on the right of its row.
  // Quarter sheet (4 per A4): same 210x297 unit frame, printed at 50% (A6). Max 30 questions.
  const QMAX = 30;
  function layoutQuarter(nQ, nChoices) {
    const T = nQ <= 20 ? { cols: 2, rows: 10, top: 122, pitch: 15, r: 5, cp: 13, lab: 16, gap: 12 }
                       : { cols: 2, rows: 15, top: 120, pitch: 10.2, r: 4.2, cp: 12, lab: 14, gap: 12 };
    const colW = T.lab + nChoices * T.cp, total = T.cols * colW + (T.cols - 1) * T.gap, right = SHEET_W / 2 + total / 2;
    const questions = [];
    for (let q = 0; q < nQ; q++) {
      const c = Math.floor(q / T.rows), row = q % T.rows, colRight = right - c * (colW + T.gap), y = T.top + row * T.pitch + T.pitch / 2;
      const bubbles = [];
      for (let k = 0; k < nChoices; k++) bubbles.push({ x: colRight - T.lab - k * T.cp - T.cp / 2, y });
      questions.push({ label: { x: colRight - T.lab / 2, y }, bubbles });
    }
    const idR = 4.4, idCp = 11.6, idTop = 60, idPitch = 11.8, idRight = 182;
    const idBubbles = [];
    for (let d = 0; d < ID_DIGITS; d++) {
      const row = [];
      for (let v = 0; v < 10; v++) row.push({ x: idRight - v * idCp - idCp / 2, y: idTop + d * idPitch + idPitch / 2 });
      idBubbles.push(row);
    }

// ===== Minimal .xlsx writer (stored ZIP, inline strings, RTL sheets) =====
const XLSX = (() => {
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const enc = new TextEncoder();
  function zip(files) { // [{name, data:string}]
    const chunks = [], central = []; let off = 0;
    for (const f of files) {
      const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
      chunks.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + data.length;
    }
    const csize = central.reduce((s, a) => s + a.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
    return new Blob([...chunks, ...central, new Uint8Array(e.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
  const x = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const col = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; };
  // sheets: [{name, rows: [[cell]], widths:[n], header: true}] cell: string | number | null
  function build(sheets) {
    const files = [];
    files.push({ name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>` });
    files.push({ name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` });
    files.push({ name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${x(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` });
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` });
    files.push({ name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="0.0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F5F5B"/></patternFill></fill></fills><borders count="2"><border/><border><left style="thin"><color rgb="FFD0D0D0"/></left><right style="thin"><color rgb="FFD0D0D0"/></right><top style="thin"><color rgb="FFD0D0D0"/></top><bottom style="thin"><color rgb="FFD0D0D0"/></bottom></border></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="4"><xf/><xf fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf borderId="1" applyBorder="1"><alignment horizontal="center"/></xf><xf numFmtId="164" borderId="1" applyNumberFormat="1" applyBorder="1"><alignment horizontal="center"/></xf></cellXfs></styleSheet>` });
    sheets.forEach((s, si) => {
      const rows = s.rows.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
        if (v == null || v === '') return '';

      }).join('')}</row>`).join('');
      const cols = s.widths ? `<cols>${s.widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
      files.push({ name: `xl/worksheets/sheet${si + 1}.xml`, data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${rows}</sheetData></worksheet>` });
    });
    return zip(files);
  }
  return { build };
})();

    let correct = 0, wrong = 0, blank = 0, multi = 0, scored = 0;
    const res = p.answers.map((a, i) => {
      const k = key[i] ?? -1;
      if (k < 0) return 'n';
      scored++;
      if (a === k) { correct++; return 'c'; }
      if (a === -1) { blank++; return 'b'; }
      if (a === -2) { multi++; return 'm'; }
      wrong++; return 'w';
    });
    const pct = scored ? correct / scored * 100 : 0;
    return { correct, wrong, blank, multi, scored, pct, score: pct / 100 * (exam.outOf || 100), res };
  }
  function studentName(exam, sid) {
    const c = classById(exam.classId);
    const s = c && c.students.find(s => String(s.id) === String(sid));
    return s ? s.name : null;
  }
  function stats(vals) {
    if (!vals.length) return null;
    const s = [...vals].sort((a, b) => a - b), n = s.length, mean = s.reduce((a, b) => a + b, 0) / n;
    const median = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
    const sd = Math.sqrt(s.reduce((a, b) => a + (b - mean) ** 2, 0) / n);
    return { n, mean, median, sd, max: s[n - 1], min: s[0] };
  }
  function itemAnalysis(exam) {
    const papers = papersOf(exam.id).filter(p => p.version >= 0 && p.version < exam.nVersions);
    const graded = papers.map(p => ({ p, g: grade(exam, p) })).sort((a, b) => b.g.pct - a.g.pct);
    const k = Math.max(1, Math.round(graded.length * 0.27));
    const upper = new Set(graded.slice(0, k)), lower = new Set(graded.slice(-k));
    const items = [];
    for (let m = 0; m < exam.nQ; m++) {
      let n = 0, c = 0, nu = 0, cu = 0, nl = 0, cl = 0;
      const dist = new Array(exam.nChoices).fill(0); let blank = 0, multi = 0, key = null;
      for (const gp of graded) {
        const map = mapOf(exam, gp.p.version), j = map.indexOf(m);
        if (j < 0) continue;
        const kk = (exam.keys[gp.p.version] || [])[j] ?? -1, cm = exam.cmaps && exam.cmaps[gp.p.version] && exam.cmaps[gp.p.version][j];
        const orig = x => x >= 0 && cm ? cm[x] : x;
        if (gp.p.version === 0 || key == null) key = orig(kk);
        if (kk < 0) continue;
        const a = gp.p.answers[j], ok = a === kk;
        n++; if (ok) c++;
        if (a >= 0) dist[orig(a)]++; else if (a === -1) blank++; else multi++;
        if (upper.has(gp)) { nu++; if (ok) cu++; }
        if (lower.has(gp)) { nl++; if (ok) cl++; }
      }
      const p = n ? c / n : null, D = nu && nl ? cu / nu - cl / nl : null;
      let note = '';
      if (p != null) {
        if (D != null && D < 0 && graded.length >= 5) note = 'nNegDisc';
        else if (p < 0.3) note = 'nVeryHard';
        else if (p > 0.9) note = 'nVeryEasy';
        else if (D != null && D < 0.2 && graded.length >= 5) note = 'nLowDisc';
        else note = 'nGood';
      }
      items.push({ q: m, key, n, p, D, dist, blank, multi, note });
    }
    return { items, count: graded.length };
  }

  function guessCols(allRows) {
    const reName = /اسم|الاسم|ناڤ|ناو|name|student|قوتابی/i;
    let skip = 0;
    for (let i = 0; i < Math.min(8, allRows.length); i++) if (allRows[i].some(x => reName.test(String(x)) && String(x).length < 30)) { skip = i; break; }
    const rows = allRows.slice(skip), h = rows[0] || [], w = h.length;
    const find = re => h.findIndex(x => re.test(String(x)) && String(x).length < 30);
    const isNum = v => /^\s*[0-9٠-٩۰-۹]+\s*$/.test(v);
    const hdrName = find(reName), hdrId = find(/^(ت|م|ر\.?|#)$|رقم|الرقم|تسلسل|ژمار|^id$|^no\.?$|number/i), hdrSec = find(/شعب|الشعبة|هوب|section|group|^class$/i);
    const header = hdrName >= 0 || (hdrId >= 0 && !isNum(h[hdrId])) || hdrSec >= 0;
    const body = header ? rows.slice(1) : rows;
    const score = j => { let txt = 0, num = 0; for (const r of body.slice(0, 40)) { const v = r[j] || ''; if (!v) continue; if (isNum(v)) num++; else if (v.length > 2) txt++; } return { txt, num }; };
    let name = hdrName, id = hdrId;
    if (name < 0) { let best = -1, bs = -1; for (let j = 0; j < w; j++) { const s = score(j).txt; if (s > bs) { bs = s; best = j; } } name = best; }
    if (id < 0 && !header) { for (let j = 0; j < w; j++) { if (j === name) continue; const s = score(j); if (s.num > body.length * 0.6) { id = j; break; } } }

  function paperEditor(d, host, onChange) {
    d.paper ||= { qs: [], cols: 0, dir: 'rtl', shufQ: true, shufC: false, seed: Math.floor(Math.random() * 1e9) };
    const p = d.paper, nC = d.nChoices;
    p.qs.forEach(q => { q.c ||= []; while (q.c.length < nC) q.c.push(''); q.c.length = nC; if (q.k >= nC) q.k = -1; });
    const L = paperLabels(d);
    const missingK = () => p.qs.filter(q => !(q.k >= 0)).length;
    host.innerHTML = `
      <div class="pe-opts">
        <label>${esc(t('peSize'))}<select id="pe-size" class="sel-sm"><option value="1" ${(p.size || 1) === 1 ? 'selected' : ''}>${esc(t('peSize1'))}</option><option value="2" ${p.size === 2 ? 'selected' : ''}>${esc(t('peSize2'))}</option><option value="4" ${p.size === 4 ? 'selected' : ''}>${esc(t('peSize4'))}</option></select></label>
        <label>${esc(t('peCols'))}<select id="pe-cols" class="sel-sm"><option value="0" ${!p.cols ? 'selected' : ''}>${esc(t('peAuto'))}</option><option value="1" ${p.cols === 1 ? 'selected' : ''}>1</option><option value="2" ${p.cols === 2 ? 'selected' : ''}>2</option></select></label>
        <label>${esc(t('peDir'))}<select id="pe-dir" class="sel-sm"><option value="rtl" ${p.dir !== 'ltr' ? 'selected' : ''}>${esc(t('peRtl'))}</option><option value="ltr" ${p.dir === 'ltr' ? 'selected' : ''}>${esc(t('peLtr'))}</option></select></label>
        ${d.nVersions > 1 ? `<label class="chk"><input type="checkbox" id="pe-sq" ${p.shufQ ? 'checked' : ''}> ${esc(t('peShufQ'))}</label><label class="chk"><input type="checkbox" id="pe-sc" ${p.shufC ? 'checked' : ''}> ${esc(t('peShufC'))}</label><button class="btn sm ghost" id="pe-reshuf">🔀 ${esc(t('peReshuf'))}</button>` : ''}
      </div>
      <div class="pe-tools"><button class="btn sm primary" id="pe-add">+ ${esc(t('peAdd'))}</button><button class="btn sm" id="pe-paste">📋 ${esc(t('pePaste'))}</button><label class="btn sm">📥 ${esc(t('peXls'))}<input type="file" id="pe-xls" accept=".xlsx,.csv,.txt" hidden></label><button class="btn sm" id="pe-prev">👁 ${esc(t('pePreview'))}</button></div>
      <div id="pe-list" class="pe-list"></div>
      <div class="pe-foot" id="pe-foot"></div>`;
    const foot = () => { const m = missingK(); $('#pe-foot').innerHTML = `${esc(tf('peCount', { n: N(p.qs.length) }))}${m ? ` — <span class="warn">${esc(tf('peNoKey', { n: N(m) }))}</span>` : ''}`; };
    const list = () => {
      $('#pe-list').innerHTML = p.qs.length ? p.qs.map((q, i) => `<div class="qcard" data-i="${i}">
        <div class="qhead"><b class="qnum">${N(i + 1)}</b><textarea data-f="t" rows="2" placeholder="${esc(t('peStem'))}" dir="auto">${esc(q.t)}</textarea>
          <div class="qbtns"><button class="btn ghost sm" data-mv="-1" aria-label="up">↑</button><button class="btn ghost sm" data-mv="1" aria-label="down">↓</button><button class="btn ghost sm" data-del aria-label="delete">✕</button></div></div>
        <div class="qchoices">${q.c.map((c, k) => `<label class="qch ${q.k === k ? 'ok' : ''}"><input type="radio" name="k${i}" data-k="${k}" ${q.k === k ? 'checked' : ''}><span class="lt">${esc(L[k])}</span><input data-c="${k}" value="${esc(c)}" placeholder="${esc(t('peChoice'))}" dir="auto"></label>`).join('')}</div>
      </div>`).join('') : `<div class="empty slim">${esc(t('peEmpty'))}</div>`;
      $('#pe-list').querySelectorAll('.qcard').forEach(card => {
        const q = p.qs[+card.dataset.i];
        card.querySelector('textarea').oninput = e => { q.t = e.target.value; };
        card.querySelectorAll('[data-c]').forEach(inp => inp.oninput = () => { q.c[+inp.dataset.c] = inp.value; });
        card.querySelectorAll('[data-k]').forEach(r => r.onchange = () => { q.k = +r.dataset.k; card.querySelectorAll('.qch').forEach((l, k) => l.classList.toggle('ok', k === q.k)); foot(); });
        card.querySelector('[data-del]').onclick = () => { p.qs.splice(+card.dataset.i, 1); list(); onChange(); };
        card.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => { const i = +card.dataset.i, j = i + +b.dataset.mv; if (j < 0 || j >= p.qs.length) return; [p.qs[i], p.qs[j]] = [p.qs[j], p.qs[i]]; list(); });
      });
      foot();
    };
    list();
    $('#pe-cols').onchange = e => { p.cols = +e.target.value; };
    $('#pe-size').onchange = e => { p.size = +e.target.value; };
    $('#pe-dir').onchange = e => { p.dir = e.target.value; paperEditor(d, host, onChange); };
    if ($('#pe-sq')) { $('#pe-sq').onchange = e => { p.shufQ = e.target.checked; }; $('#pe-sc').onchange = e => { p.shufC = e.target.checked; }; $('#pe-reshuf').onclick = () => { p.seed = Math.floor(Math.random() * 1e9); toast('🔀 ' + t('peReshufDone')); }; }
    $('#pe-add').onclick = () => { p.qs.push({ t: '', c: Array(nC).fill(''), k: -1 }); list(); onChange(); const ta = $('#pe-list').querySelectorAll('textarea'); ta[ta.length - 1].focus(); };
    $('#pe-paste').onclick = () => modal(`<div class="bar"><h3>${esc(t('pePaste'))}</h3><button class="btn ghost" data-x>✕</button></div>
      <p class="hint">${esc(t('pePasteHelp'))}</p>
      <pre class="pe-ex" dir="auto">${esc(t('pePasteEx'))}</pre>
      <textarea id="pp-t" rows="10" dir="auto"></textarea><p id="pp-info" class="hint"></p>
      <div class="actions"><button class="btn primary" data-a>${esc(t('peAppend'))}</button><button class="btn" data-r>${esc(t('peReplace'))}</button></div>`, (m, close) => {
      const ta = m.querySelector('#pp-t'), info = () => { const qs = PAPER.parse(ta.value); m.querySelector('#pp-info').textContent = tf('peParsed', { n: N(qs.length), k: N(qs.filter(q => q.k >= 0).length) }); return qs; };
      ta.oninput = info; m.querySelector('[data-x]').onclick = close;
      const take = rep => { const qs = info(); if (!qs.length) return toast(t('peNone'), 'bad'); if (rep) p.qs.length = 0; for (const q of qs) p.qs.push(q); close(); onChange(true); };
      m.querySelector('[data-a]').onclick = () => take(false); m.querySelector('[data-r]').onclick = () => take(true);
    });
    $('#pe-xls').onchange = async e => {
      const f = e.target.files[0]; e.target.value = ''; if (!f) return;
      try {
        const wb = await XLSREAD.read(f), rows = (wb.sheets.find(s => s.rows.length) || { rows: [] }).rows;
        let start = 0, qc = 0, kc = -1;
        const hi = rows.findIndex(r => r.some(x => /سؤال|السؤال|الاسئلة|الأسئلة|پسیار|question/i.test(x)));
        if (hi >= 0 && hi < 6) { start = hi + 1; qc = rows[hi].findIndex(x => /سؤال|السؤال|الاسئلة|الأسئلة|پسیار|question/i.test(x)); kc = rows[hi].findIndex(x => /صحيح|الجواب|الإجابة|الاجابة|بەرسڤ|answer|correct|key/i.test(x)); }
        else { const w = Math.max(...rows.map(r => r.length)); if (w >= nC + 2) kc = nC + 1; }
        const CH = { 'أ': 0, 'ا': 0, 'آ': 0, 'ب': 1, 'ج': 2, 'د': 3, 'ه': 4, 'هـ': 4, a: 0, b: 1, c: 2, d: 3, e: 4 };
        let n = 0;
        for (const r of rows.slice(start)) {
          const stem = (r[qc] || '').trim(); if (!stem) continue;
          const c = []; for (let k = 0; k < nC; k++) c.push((r[qc + 1 + k] || '').trim());
          let key = -1; const kv = kc >= 0 ? String(r[kc] || '').trim() : '';
          if (kv) { const low = kv.toLowerCase(), num = parseInt(String(kv).replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x))); if (CH[low] != null) key = CH[low]; else if (num >= 1 && num <= nC) key = num - 1; else key = c.indexOf(kv); }
          p.qs.push({ t: stem, c, k: key }); n++;
        }
        toast(tf('peParsed', { n: N(n), k: N(p.qs.slice(-n).filter(q => q.k >= 0).length) })); onChange(true);
      } catch (err) { console.error(err); toast(err.code === 'xls' ? t('xlsOld') : t('xlsErr'), 'bad'); }
    };
    $('#pe-prev').onclick = async () => {
      if (!p.qs.length) return toast(t('peNone'), 'bad');
      onChange(false, true);
      const pages = await buildPaper(d), lab = paperLabels(d);
      let v = 0;
      modal(`<div class="bar"><h3>${esc(t('pePreview'))}</h3><button class="btn ghost" data-x>✕</button></div><div class="vtabs" id="pv-tabs"></div><div id="pv-msg"></div><div class="preview" id="pv-svg"></div>`, (m, close) => {
        m.querySelector('[data-x]').onclick = close;
        const draw = () => {
          m.querySelector('#pv-tabs').innerHTML = pages.length > 1 ? pages.map((_, i) => `<button class="${i === v ? 'on' : ''}" data-v="${i}">${esc(t('version'))} ${esc(lab[i])}</button>`).join('') : '';
          m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { v = +b.dataset.v; draw(); });
          m.querySelector('#pv-msg').innerHTML = pages[v].overflow ? `<div class="alert">${esc(t('peOverflow'))}</div>` : '';
          m.querySelector('#pv-svg').innerHTML = PAPER.svgFor(pages[v]);
        };
        draw();
      });
    };
  }
  function vPrintPaper(el, ex) {
    const built = ex.paper && ex.paper.built;
    if (!built || built.hash !== paperHash(ex)) {
      el.innerHTML = `<div class="bar"><button class="btn ghost" id="back">→ ${esc(t('back'))}</button><h2>${esc(t('print'))}</h2></div><div class="alert">${esc(t('peNeedSave'))}</div><div class="actions"><button class="btn primary" id="edit">✎ ${esc(t('edit'))}</button></div>`;
      $('#back').onclick = () => go('exam', { id: ex.id }); $('#edit').onclick = () => go('examEdit', { id: ex.id }); return;
    }
    const pages = built.pages, lab = paperLabels(ex), studs = examStudents(ex), c = classById(ex.classId);
    el.innerHTML = `<div class="bar"><button class="btn ghost" id="back">→ ${esc(t('back'))}</button><h2>${esc(t('print'))}</h2></div>
      ${pages.some(pg => pg.overflow) ? `<div class="alert">${esc(t('peOverflow'))}</div>` : ''}
      <div class="panel form">
        <label class="radio wide"><input type="radio" name="pm" value="blank" checked> ${esc(t('printBlank'))}</label>
        <label>${esc(t('copies'))}<input id="p-copies" type="number" min="1" max="300" value="${Math.max(1, studs.length || 30)}"></label>
        ${pages.length > 1 ? `<label>${esc(t('version'))}<select id="p-ver"><option value="alt">${esc(t('alternate'))}</option>${pages.map((_, v) => `<option value="${v}">${esc(lab[v])}</option>`).join('')}</select></label>` : ''}
        ${studs.length ? `<label class="radio wide"><input type="radio" name="pm" value="students"> ${esc(t('printStudents'))} (${N(studs.length)})</label>` : ''}
      </div>
      <p class="hint">${esc(t((pages[0].size || 1) > 1 ? 'printHintPn' : 'printHintP'))}</p>
      <div class="actions"><button class="btn primary" id="go">🖨 ${esc(t('printNow'))}</button></div>
      <div class="preview" id="pv"></div>`;
    const build = () => {
      const mode = (el.querySelector('input[name=pm]:checked') || {}).value, vs = $('#p-ver') ? $('#p-ver').value : '0';
      const verFor = i => vs === 'alt' ? i % pages.length : +vs, out = [];
      if (mode === 'students') [...studs].sort((a, b) => (a.sec > b.sec) - (a.sec < b.sec) || a.id - b.id).forEach((s, i) => out.push(PAPER.svgFor(pages[verFor(i)], { id: ex.useId !== false ? s.id : null, name: s.name }, c && secOf(c, s.sec) ? c.name + ' ' + secOf(c, s.sec).name : null)));
      else { const n = Math.max(1, Math.min(300, parseInt($('#p-copies').value) || 1)); for (let i = 0; i < n; i++) out.push(PAPER.svgFor(pages[verFor(i)])); }
      return out;
    };
    const per = pages[0].size || 1;
    const cell = sv => {
      const inner = sv.replace(' width="210mm" height="297mm"', ' width="210" height="297"');
      return per === 2 ? `<div class="tcell"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 297 210" preserveAspectRatio="xMidYMid meet"><g transform="translate(0 210) rotate(-90)">${inner}</g></svg></div>` : `<div class="tcell">${inner.replace('<svg ', '<svg preserveAspectRatio="xMidYMid meet" ')}</div>`;
    };
    const sheets = () => {
      const all = build();
      if (per === 1) return all.map(s => `<div class="page">${s}</div>`);
      const out = [];
      for (let i = 0; i < all.length; i += per) out.push(`<div class="page tpage per${per} nopad">${all.slice(i, i + per).map(cell).join('')}${per === 4 ? '<i class="cut v"></i>' : ''}<i class="cut h"></i></div>`);
      return out;
    };
    const pv = () => { $('#pv').innerHTML = sheets()[0]; $('#pv').classList.toggle('quadpv', per > 1); };
    el.querySelector('.panel.form').addEventListener('change', pv); pv();
    $('#back').onclick = () => go('exam', { id: ex.id });
    $('#go').onclick = () => printPages(sheets().join(''));
  }


  // ---------- settings ----------
  function vSettings(el) {
    const S = db.settings;
    const opt = (v, cur, txt) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${esc(txt)}</option>`;
    el.innerHTML = `<div class="bar"><h2>${esc(t('settings'))}</h2></div>
      <div class="panel form">
        <label>${esc(t('lang'))}<select id="s-lang">${opt('ar', S.lang, 'العربية')}${opt('ku', S.lang, 'کوردی (بادینی)')}</select></label>
        <label>${esc(t('labels'))}<select id="s-lab">${opt('ar', S.labels, 'أ ب ج د هـ')}${opt('en', S.labels, 'A B C D E')}${opt('num', S.labels, '1 2 3 4 5')}</select></label>
        <label>${esc(t('digits'))}<select id="s-dig">${opt('ar', S.digits, '١ ٢ ٣')}${opt('en', S.digits, '1 2 3')}</select></label>
      </div>
      <div class="panel"><div class="bar"><h3>${esc(t('tplTitle'))}</h3><label class="btn primary">+ ${esc(t('tplAdd'))}<input type="file" id="tpl-new" accept="image/*" hidden></label></div>
        <p class="hint">${esc(t('tplHelp'))}</p>
        ${db.templates.length ? `<div class="cards">${db.templates.map(tp => `<button class="card tpl" data-id="${tp.id}">${tp.img ? `<img class="tplthumb" src="${tp.img}" alt="">` : ''}<b>${esc(tp.name)}</b><span>${N(tplQ(tp))} ${esc(t('questions'))}، ${N(tp.nC)} ${esc(t('nChoices'))}</span></button>`).join('')}</div>` : `<div class="empty">${esc(t('tplNone'))}</div>`}
        ${PRESETS.some(pr => !db.templates.some(x => x.id === pr.id)) ? `<div class="actions"><button class="btn" id="tpl-restore">↺ ${esc(t('tplRestore'))}</button></div>` : ''}</div>
      <div class="panel"><h3>${esc(t('backup'))}</h3><p class="hint">${esc(t('about'))}</p><p class="hint ver">${esc(t('appVersion'))}: ${APP_VERSION}</p>
        <div class="actions"><button class="btn" id="exp">⬇ ${esc(t('exportJson'))}</button><label class="btn">⬆ ${esc(t('importJson'))}<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn danger" id="clr">${esc(t('clearAll'))}</button></div></div>`;
    el.querySelectorAll('.tpl').forEach(b => b.onclick = () => go('tplEdit', { id: b.dataset.id }));
    if ($('#tpl-restore')) $('#tpl-restore').onclick = () => {
      db.settings.removedPresets = [];
      for (const pr of PRESETS) if (!db.templates.some(x => x.id === pr.id)) db.templates.unshift(JSON.parse(JSON.stringify(pr)));
      persist(); toast('✓ ' + t('tplRestore')); render();
    };
    $('#tpl-new').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const im = await loadImage(f), sc = Math.min(1, 1600 / Math.max(im.width, im.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        go('tplEdit', { id: null, draft: { id: uid(), name: t('tplDefaultName') + ' ' + (db.templates.length + 1), img: cv.toDataURL('image/jpeg', 0.85), iw: cv.width, ih: cv.height, nC: 4, blocks: [], rScale: 1, v: 1 } });
      } catch (err) { toast('✕ ' + err.message, 'bad'); }
    };
    $('#s-lang').onchange = e => { S.lang = e.target.value; persist(); render(); };
    $('#s-lab').onchange = e => { S.labels = e.target.value; persist(); };
    $('#s-dig').onchange = e => { S.digits = e.target.value; persist(); };
    $('#exp').onclick = () => download(new Blob([JSON.stringify(db)], { type: 'application/json' }), 'musahhih-backup-' + new Date().toISOString().slice(0, 10) + '.json');
    $('#imp').onchange = async e => {
      try {
        const d = JSON.parse(await e.target.files[0].text());
        if (!d || !Array.isArray(d.exams) || !Array.isArray(d.classes)) throw new Error('format');
        if (!confirm(t('confirmDel'))) return;
        localStorage.setItem(KEY, JSON.stringify(d)); load(); toast('✓ ' + t('importOk')); render();
      } catch (err) { toast('✕ ' + err.message, 'bad'); }
    };
    $('#clr').onclick = () => { if (confirm(t('confirmDel'))) { localStorage.removeItem(KEY); load(); render(); } };
  }

  render();
  window.__app = { db: () => db, go, persist, grade, itemAnalysis, exportXlsx };
})();

</script>
